services:
  - type: web
    name: service-usage-manager-v5
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: service-usage-manager-db
          property: connectionString
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: service-usage-manager-db
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: service_usage
    user: service_usage_app
    diskSizeGB: 15
    storageAutoscalingEnabled: true
